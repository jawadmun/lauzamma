<style>
:root{--bg:#f2f4f0;--card:#fff;--ink:#15211b;--mut:#58675f;--line:#d9e0da;--acc:#0a6b4c;--on:#fff;--soft:#e2f0e9;--bad:#a8281f;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1511;--card:#16201a;--ink:#e5eee8;--mut:#94a79c;--line:#27352d;--acc:#46c697;--on:#05251a;--soft:#1a2e25;--bad:#ff9087;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1511;--card:#16201a;--ink:#e5eee8;--mut:#94a79c;--line:#27352d;--acc:#46c697;--on:#05251a;--soft:#1a2e25;--bad:#ff9087;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px 0}
h1{font-size:18px;font-weight:600;margin:0}
.sub{color:var(--mut);font-size:12.5px;margin:2px 0 10px}
.tabs{display:flex}
.tabs button{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:10px 4px;font:inherit;font-weight:500;color:var(--mut)}
.tabs b{background:var(--soft);color:var(--acc);border-radius:10px;padding:1px 8px;font-size:12px;margin-left:4px}
body[data-tab=c] .tabs [data-t=c],body[data-tab=s] .tabs [data-t=s]{color:var(--acc);border-color:var(--acc)}
main{padding:14px 16px 90px;max-width:1180px;margin:auto}
.fl{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.fl input[type=search],.chk{grid-column:1/-1}
input,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;min-width:0;width:100%}
.chk{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:14px}
.chk input{width:auto}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.c{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:8px;padding:12px 14px;margin-bottom:10px}
.c.f{border-left-color:var(--bad)}
.c.on{background:var(--soft)}
.h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.h b{font-size:16px}
.st{font-size:12.5px;font-weight:500;color:var(--acc)}
.f .st{color:var(--bad)}
.c h3{font-size:15px;font-weight:500;margin:2px 0 8px}
dl{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin:0 0 10px}
dt{font-size:12px;color:var(--mut)}
dd{margin:0}
.w{color:var(--bad);font-size:13px;margin:0 0 8px}
button.a{width:100%;padding:11px;border-radius:8px;border:1px solid var(--acc);background:var(--acc);color:var(--on);font:inherit;font-weight:600}
button.a.rm{background:none;color:var(--acc)}
button:disabled{opacity:.45;cursor:not-allowed}

.more{width:100%;padding:14px;border-radius:15px;border:1.5px dashed var(--acc);background:var(--soft);color:var(--acc);font:inherit;font-weight:600;margin:2px 0 18px}
#cnt{font-weight:500}.nt{border-radius:16px}
#toast{border-radius:15px;padding:12px 16px;font-weight:500;background:color-mix(in srgb,var(--ink) 92%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 16px 38px -14px rgba(0,0,0,.55)}
@media(prefers-reduced-motion:reduce){header::after,.c{animation:none!important}}
h1{font-size:25px;font-weight:800;letter-spacing:-.035em}.ind{font-family:var(--fd);font-size:11px;letter-spacing:.08em;font-weight:600;background:linear-gradient(90deg,var(--acc),var(--ge));-webkit-background-clip:text;background-clip:text;color:transparent}#rest{padding:11px;border-radius:12px;border:1.5px dashed var(--acc);background:transparent;color:var(--acc);font:inherit;font-weight:600}
.insbox{grid-column:1/-1;position:relative}
.inc{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.inc:empty{display:none}
.chip{border:0;border-radius:999px;padding:6px 7px 6px 13px;background:color-mix(in srgb,var(--acc) 16%,var(--card));color:var(--acc);font:inherit;font-size:13px;font-weight:600;display:inline-flex;gap:7px;align-items:center}
.chip b{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--acc) 24%,transparent);font-size:13px;line-height:1}
.chip.clr{background:transparent;color:var(--mut);box-shadow:inset 0 0 0 1px var(--line);padding:6px 13px}
.inl{margin-top:8px;border:1px solid var(--line);border-radius:16px;background:var(--card);box-shadow:var(--sh);max-height:300px;overflow:auto;padding:5px}
.ir{display:flex;align-items:center;gap:11px;width:100%;text-align:left;border:0;background:transparent;color:var(--ink);font:inherit;padding:11px 10px;border-radius:11px}
.ir i{flex:none;width:21px;height:21px;border-radius:7px;box-shadow:inset 0 0 0 1.6px var(--mut);position:relative}
.ir.on{background:var(--soft)}.ir.on i{background:linear-gradient(135deg,var(--acc),var(--ge));box-shadow:none}
.ir.on i::after{content:"";position:absolute;left:7px;top:3.5px;width:5px;height:10px;border:solid var(--on);border-width:0 2.2px 2.2px 0;transform:rotate(45deg)}
.ir span{flex:1;min-width:0}.ir em{font-style:normal;font-size:12px;color:var(--mut)}
.dn{position:sticky;bottom:0;width:100%;margin-top:4px;padding:12px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--acc),var(--ge));color:var(--on);font:inherit;font-weight:700}
.hero .sg{display:block;margin-top:6px;font:600 11px var(--fd);letter-spacing:.08em;opacity:.9}
.thx{position:relative}
#thbtn{width:34px;height:34px;border-radius:50%;border:2px solid var(--card);box-shadow:0 0 0 1px var(--line),0 6px 14px -6px var(--acc);padding:0;cursor:pointer}
:root[data-mode="color"] .hero{box-shadow:inset 0 0 0 1px rgba(255,255,255,.22),0 12px 26px -12px rgba(0,0,0,.55)}
#thpop{max-height:min(70vh,560px);overflow-y:auto;overscroll-behavior:contain;position:absolute;right:-8px;top:calc(100% + 12px);z-index:60;width:min(330px,calc(100vw - 24px));display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px;border-radius:20px;background:var(--card);border:1px solid var(--line);box-shadow:0 24px 50px -16px rgba(0,0,0,.45)}
#thpop[hidden]{display:none}
#thpop button{border:0;border-radius:14px;padding:6px 6px 8px;background:var(--soft);color:var(--ink);font:inherit;font-size:12px;font-weight:600;display:flex;flex-direction:column;gap:6px;text-align:center}
#thpop button span{display:block;height:36px;border-radius:10px}
#thpop button.on{box-shadow:0 0 0 2px var(--acc);background:color-mix(in srgb,var(--acc) 12%,var(--card))}
.thm{flex-wrap:wrap;justify-content:flex-end;max-width:100%}.thm button{width:23px;height:23px}
#thpop .ns{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 4px 2px;border-top:1px solid var(--line);font-size:12px;font-weight:600}
#thpop .ns b{flex:1 0 100%;font-weight:700}
#thpop .ns label{display:flex;align-items:center;gap:6px;color:var(--mut)}
#thpop .ns input{font:inherit;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:6px 8px}

/* compact course grid: two cards side by side (three on wide screens) */
#list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-items:stretch}
@media(min-width:1100px){#list{grid-template-columns:repeat(3,minmax(0,1fr))}}
#list .more,#list .empty{grid-column:1/-1}
#list .more{margin:2px 0 12px;padding:12px}
#list .c{margin:0;padding:9px 8px 8px 12px;border-radius:14px;display:flex;flex-direction:column;min-width:0;animation:none}
#list .c::before{width:4px}
#list .c .h{flex-wrap:wrap;gap:4px 6px;align-items:center}
#list .c .h b{font-size:12px;padding:2px 7px;border-radius:8px}
#list .c .st{font-size:10px;padding:3px 7px;white-space:normal;line-height:1.2}
#list .c h3{font-size:12.5px;line-height:1.28;margin:5px 0 5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#list .c.ex h3{-webkit-line-clamp:unset;display:block}
#list .c .mt{height:4px;margin:0 0 6px}
#list .c dl{display:flex;flex-direction:column;gap:4px;margin:0 0 5px}
#list .c dt{font-size:8px;letter-spacing:.05em}
#list .c .rq dt{text-transform:none;letter-spacing:0;font-size:9.5px}
#list .c dd{font-size:11px;line-height:1.28;overflow-wrap:anywhere}
#list .c dl>div.lo{display:none}
#list .c.ex dl>div.lo{display:block}
#list .c .rq dd{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
#list .c.ex .rq dd{display:block}
#list .c .mr{align-self:flex-start;font-size:10.5px;font-weight:600;color:var(--acc);margin:0 0 5px;cursor:pointer}
#list .c .at,#list .c .w{font-size:10.5px;padding:6px 7px;margin:0 0 7px;border-radius:8px}
#list .c button.a{margin-top:auto;padding:7px 6px;font-size:11.5px;border-radius:11px}

/* two-pane layout: schedule on the left (always visible), course search on the right */
body{display:flex;flex-direction:column;height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:hidden}
header{position:relative;top:0!important;z-index:20;flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:6px 10px 8px!important}
header .top{flex:1 1 100%}header .sub,header .tabs{display:none}
header #trm{flex:1 1 30%;min-width:0;margin:0}header .sr{flex:1 1 60%;min-width:0;margin:0;gap:6px}
main{flex:1;min-height:0;display:grid!important;grid-template-columns:minmax(0,1.12fr) minmax(0,1fr)!important;gap:8px;max-width:none!important;margin:0!important;padding:8px!important;align-items:stretch!important}
@media(min-width:900px){main{grid-template-columns:minmax(380px,.85fr) minmax(0,1.15fr)!important}}
body[data-tab] #pc,body[data-tab] #ps{min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
body[data-tab] #pc{display:block!important;container:pc/inline-size}
body[data-tab] #ps{display:flex!important;flex-direction:column;gap:8px;order:-1}
#ps>:nth-child(4){order:-3}#ps>:nth-child(3){order:-2}#ps>:nth-child(5){order:-1}#ps>:nth-child(2){order:2}#ps>:nth-child(6){order:3}
#ps .p{margin:0}
#tt{padding:6px 4px!important;container:tt/inline-size;display:flex;flex-direction:column}
#tt .studio,#tt .hero .sg{display:none}
#tt .hero{padding:8px 10px!important;border-radius:14px!important;margin-bottom:6px!important;gap:6px}#tt .hero h2{font-size:14px!important}#tt .ring{zoom:.7}
#tt .seg:not(.o){order:-1;margin:0 0 4px}#tt .dh{order:1}#tt .tb{order:2}#tt .hero{order:3;margin-top:8px}#tt .tba{order:4}#tt .chips{order:5}#tt .lg{order:6}
#tt .dh,#tt .tb{grid-template-columns:20px repeat(var(--n),1fr);margin-left:0;margin-right:0}
#tt .dh span{font-size:9px;padding:3px 0}#tt .hh i{font-size:8.5px}
#tt .col{background-image:repeating-linear-gradient(var(--line) 0 1px,transparent 1px var(--hh,92px))}
#tt .blk{padding:2px 1px 1px 3px!important;gap:0!important;border-radius:6px!important}#tt .blk::before{display:none}
#tt .blk b{font-size:clamp(7px,calc((100cqw - 30px)/var(--n)*.2),13px)!important;letter-spacing:-.02em}
#tt .blk em{font-size:clamp(5.5px,calc((100cqw - 30px)/var(--n)*.15),10.5px)!important;letter-spacing:-.03em}
#tt .blk .in,#tt .blk .lc{display:none}
@container tt (min-width:380px){#tt .blk .in,#tt .blk .lc{display:block}}
@container pc (max-width:340px){.fl{grid-template-columns:1fr}}
#list{grid-template-columns:repeat(auto-fill,minmax(168px,1fr))!important}
#list .c{padding:10px 9px 9px 13px!important}#list .c h3{font-size:13px}#list .c dd{font-size:11.5px}#list .c dt{font-size:8.5px}#list .c .h b{font-size:13px}#list .c .st{font-size:10.5px}#list .c button.a{font-size:12px;padding:8px 6px}#list .c .mr{font-size:11px}
#q{margin-bottom:8px}.fd{margin-bottom:10px}.fd summary{cursor:pointer;font-weight:600;color:var(--acc);padding:6px 2px;list-style:none}.fd summary::-webkit-details-marker{display:none}.fd[open] summary{margin-bottom:6px}
